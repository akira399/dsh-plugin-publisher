# dsh-plugin-publisher bundle patch: mounts the plugin into the host composition
# of a dsh profile.
#
# ⚠️ CONSENT GATE: the skill is ONLY registered when `config.consent` is true.
# The default is false — the plugin stays inert until the user explicitly
# enables it (this is intentional: the skill drives operations that create
# public GitHub repositories and push code, so it must never activate without
# the user's explicit opt-in).
#
# Enable (pick one):
#   1. Marketplace install: edit the row the market appended to
#      `~/.dsh/profiles/web/cordis.patch.yml` and add `config.consent: true`
#      under the `dsh-plugin-publisher` entry.
#   2. `dsh plugin add` install: the row lives in this bundle layer, so add a
#      DIRECT override entry (no `- insert:` — duplicate ids fail to boot) to
#      the profile's `cordis.patch.yml`:
#        - id: dsh-plugin-publisher
#          name: dsh-plugin-publisher
#          config:
#            consent: true
#   3. One-shot (no persist): write that direct entry to `enable.yml` and run
#      `dsh web --patch ./enable.yml`
# Then restart dsh.
- insert:
    - id: dsh-plugin-publisher
      name: dsh-plugin-publisher
      config:
        consent: false
